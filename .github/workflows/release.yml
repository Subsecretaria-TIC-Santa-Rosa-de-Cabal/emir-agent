name: Release emir-agent

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            asset: emir-agent-linux-amd64
            archive: emir-agent-linux-amd64.tar.gz
          - os: macos-latest
            goos: darwin
            goarch: amd64
            asset: emir-agent-macos-amd64
            archive: emir-agent-macos-amd64.tar.gz
          - os: windows-latest
            goos: windows
            goarch: amd64
            asset: emir-agent-windows-amd64.exe
            archive: emir-agent-windows-amd64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ASSET: ${{ matrix.asset }}
          ARCHIVE: ${{ matrix.archive }}
          IS_WINDOWS: ${{ matrix.os == 'windows-latest' }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p dist
          export CGO_ENABLED=0

          go build -ldflags "-s -w -X github.com/Subsecretaria-TIC-Santa-Rosa-de-Cabal/emir-agent/internal/models.Version=$VERSION" -o "dist/$ASSET" .

          if [ "$IS_WINDOWS" = "true" ]; then
            powershell -Command 'Compress-Archive -Path dist\$env:ASSET -DestinationPath dist\$env:ARCHIVE -Force'
          else
            tar -czf "dist/$ARCHIVE" -C dist "$ASSET"
          fi

          sha256sum "dist/$ASSET" | awk '{print $1}' > "dist/$ASSET.sha256"

      - name: Verify compiled version
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          ASSET: ${{ matrix.asset }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if [ "$GOOS" = "windows" ]; then
            OUTPUT=$(powershell -Command '& dist\$env:ASSET --version')
          else
            OUTPUT=$(./dist/$ASSET --version)
          fi
          echo "Compiled version: $OUTPUT"
          if [ "$OUTPUT" != "$VERSION" ]; then
            echo "Expected version $VERSION, got $OUTPUT"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
            dist/${{ matrix.archive }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Copy install scripts to artifacts
        run: |
          cp scripts/install-windows.ps1 artifacts/
          cp scripts/install-linux.sh artifacts/
          cp scripts/install-macos.sh artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
